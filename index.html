<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#f4eee8"/><meta name="description" content="削って、ほどけて、ひと休み。音と破片を楽しむ石鹸ASMRゲーム。"/><title>Soap Slice — a little moment of calm</title></head>
<body><main id="app"><header><a class="brand" href="./" aria-label="Soap Slice ホーム">soap<span>slice</span><i>✳</i></a><span class="edition">A LITTLE MOMENT OF CALM</span></header>
<section class="status"><div class="status-line"><span id="level">LEVEL 01</span><span id="percent">0<span>%</span></span></div><div class="track" role="progressbar" aria-label="削った量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress"></div></div><div class="soap-label"><span id="soap-name">01 — ROSE MARBLE</span><span id="mode-label">ゆっくり、ひと削り。</span></div></section>
<div id="scene" aria-label="石鹸を下方向へドラッグして削るゲームエリア"><canvas id="canvas"></canvas></div>
<section class="hint" id="hint"><span class="gesture">↓</span><h1>削って、ほどけて、ひと休み。</h1><p>下になぞって、音と手ざわりを楽しもう</p></section>
<section class="complete" id="complete" hidden aria-live="polite"><span class="eyebrow">A LITTLE TREASURE</span><h2>ひと削りの、ごほうび。</h2><p>小さな星を見つけました。</p><button id="next">次の石鹸へ <span>↗</span></button></section>
<footer><div class="controls"><button id="reset" aria-label="石鹸をリセット"><span>↺</span><small>リセット</small></button><button id="sound" aria-pressed="false"><span id="sound-icon">♫</span><small id="sound-label">音 OFF</small></button><button id="free" aria-pressed="false"><span>∞</span><small>フリーモード</small></button></div><p class="footer-note">NO RUSH. JUST ONE MORE SLICE.</p></footer><div id="error" hidden role="alert"></div></main><script type="module" src="/src/main.ts"></script></body></html>
